name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Xcode version
        run: |
          echo "::warning::AVAILABLE_XCODES=$(ls /Applications | grep -i xcode | tr '\n' ',')"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          echo "::warning::GEN_DONE ls_root=$(ls -1 | tr '\n' ',')"
          if [ -d DanceAlarm.xcodeproj ]; then
            echo "::warning::PROJ_EXISTS contents=$(ls -1 DanceAlarm.xcodeproj | tr '\n' ',')"
          else
            echo "::warning::PROJ_MISSING"
          fi
          if [ -f DanceAlarm.xcodeproj/project.pbxproj ]; then
            echo "::warning::PBXPROJ_SIZE=$(wc -c < DanceAlarm.xcodeproj/project.pbxproj)"
          else
            echo "::warning::PBXPROJ_MISSING"
          fi

      - name: List simulators
        run: |
          xcrun simctl list devices available | grep -i iphone | head -5
          SIM_NAME=$(xcrun simctl list devices available -j | python3 -c "
import json,sys
d = json.load(sys.stdin)
for runtime, devices in d['devices'].items():
    for dev in devices:
        if 'iPhone' in dev['name']:
            print(dev['name'])
            sys.exit(0)
")
          echo "SIM_NAME=$SIM_NAME" >> $GITHUB_ENV
          echo "::warning::CHOSEN_SIM=$SIM_NAME"

      - name: Inspect project format
        run: |
          echo "::warning::OBJVER=$(grep -m1 objectVersion DanceAlarm.xcodeproj/project.pbxproj)"
          xcodebuild -list -project DanceAlarm.xcodeproj 2>&1 | while IFS= read -r line; do echo "::warning::LIST:$line"; done || true

      - name: Build for Simulator (проверка компиляции)
        run: |
          set -o pipefail
          xcodebuild build \
            -project DanceAlarm.xcodeproj \
            -scheme DanceAlarm \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log || {
              echo "----- ERROR LINES ONLY -----";
              grep -iE "error:|BUILD FAILED|fatal|cannot find|no such module" build.log | sort -u | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done;
              exit 1;
            }

      # Сборка неподписанного .ipa для устройства (нужна для дальнейшей подписи локально в Xcode
      # либо через свой сертификат/профиль, добавленный сюда как GitHub Secret)
      - name: Build unsigned .xcarchive for device
        run: |
          xcodebuild archive \
            -project DanceAlarm.xcodeproj \
            -scheme DanceAlarm \
            -destination "generic/platform=iOS" \
            -archivePath build/DanceAlarm.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned .ipa (Payload)
        run: |
          mkdir -p build/Payload
          cp -r build/DanceAlarm.xcarchive/Products/Applications/DanceAlarm.app build/Payload/
          cd build && zip -r DanceAlarm-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DanceAlarm-unsigned-ipa
          path: build/DanceAlarm-unsigned.ipa
