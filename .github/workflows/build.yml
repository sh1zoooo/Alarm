name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xcode 16.2 нужен, потому что XcodeGen генерирует project.pbxproj
      # в формате (objectVersion 77), который не читает Xcode 15.x на раннере
      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build for Simulator (проверка компиляции)
        run: |
          set -o pipefail
          xcodebuild build \
            -project DanceAlarm.xcodeproj \
            -scheme DanceAlarm \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log || {
              grep -iE "error:|BUILD FAILED|fatal|cannot find|no such module" build.log | sort -u | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done;
              exit 1;
            }

      # Сборка неподписанного .ipa для устройства (нужна для дальнейшей подписи локально в Xcode
      # либо через свой сертификат/профиль, добавленный сюда как GitHub Secret)
      - name: Build unsigned .xcarchive for device
        run: |
          xcodebuild archive \
            -project DanceAlarm.xcodeproj \
            -scheme DanceAlarm \
            -destination "generic/platform=iOS" \
            -archivePath build/DanceAlarm.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned .ipa (Payload)
        run: |
          mkdir -p build/Payload
          cp -r build/DanceAlarm.xcarchive/Products/Applications/DanceAlarm.app build/Payload/
          cd build && zip -r DanceAlarm-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DanceAlarm-unsigned-ipa
          path: build/DanceAlarm-unsigned.ipa
